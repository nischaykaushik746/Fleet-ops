spring.application.name=FleetOps-Test

spring.datasource.url=jdbc:h2:mem:fleetops_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-minimum-256-bits-required
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000
jwt.issuer=fleetops-test
jwt.audience=fleetops-test-api

ratelimit.requests-per-window=1000
ratelimit.window-size-seconds=60
ratelimit.auth.requests-per-window=100
ratelimit.auth.window-size-seconds=60

login.max-attempts=5
login.lockout-duration-minutes=15

spring.cache.type=caffeine
cache.drivers.max-size=100
cache.drivers.expire-after-write-seconds=60
cache.vehicles.max-size=100
cache.vehicles.expire-after-write-seconds=60
cache.trips.max-size=100
cache.trips.expire-after-write-seconds=30
cache.analytics.max-size=10
cache.analytics.expire-after-write-seconds=10

circuitbreaker.failure-threshold=3
circuitbreaker.success-threshold=2
circuitbreaker.timeout-ms=5000
circuitbreaker.half-open-max-calls=2

retry.max-attempts=2
retry.initial-delay-ms=50
retry.multiplier=2.0
retry.max-delay-ms=1000

timeout.assignment-ms=2000
timeout.default-ms=3000

lock.lease-time-ms=3000
lock.max-wait-time-ms=2000

threadpool.trip.core-size=2
threadpool.trip.max-size=4
threadpool.trip.queue-capacity=10
threadpool.trip.keep-alive-seconds=30

threadpool.analytics.core-size=2
threadpool.analytics.max-size=4
threadpool.analytics.queue-capacity=10
threadpool.analytics.keep-alive-seconds=30

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.root=WARN
logging.level.com.fleetops=DEBUG

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret